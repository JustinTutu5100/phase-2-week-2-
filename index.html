<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Goal Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-800 text-gray-800">

  <header class="bg-blue-600 text-white p-4 text-center shadow">
    <h1 class="text-2xl font-bold">Smart Goal Planner</h1>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-8">

    <section id="overview" class="bg-white rounded-xl shadow p-4">
      <h2 class="text-xl font-semibold mb-2">Overview</h2>
      <div class="flex flex-wrap gap-4">
        <p class="bg-blue-100 text-blue-800 px-3 py-1 rounded">Total Goals: <span id="total-goals">0</span></p>
        <p class="bg-green-100 text-green-800 px-3 py-1 rounded">Total Saved: $<span id="total-saved">0</span></p>
        <p class="bg-purple-100 text-purple-800 px-3 py-1 rounded">Goals Completed: <span id="completed-goals">0</span></p>
      </div>
    </section>

    <section id="add-goal" class="bg-white rounded-xl shadow p-4">
      <h2 class="text-xl font-semibold mb-2">Add New Goal</h2>
      <form id="goal-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="goal-name" placeholder="Goal Name" required class="border rounded p-2">
        <input type="number" id="goal-target" placeholder="Target Amount" required class="border rounded p-2">
        <input type="text" id="goal-category" placeholder="Category" required class="border rounded p-2">
        <input type="date" id="goal-deadline" required class="border rounded p-2">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 md:col-span-2">Add Goal</button>
      </form>
    </section>

  <section id="goals-list" class="bg-white rounded-xl shadow p-4 overflow-x-auto">
  <h2 class="text-xl font-semibold mb-4">Your Goals</h2>
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Goal</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Target Amount</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Saved Amount</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Category</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Deadline</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Created At</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Time Left</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
      </tr>
    </thead>
    <tbody id="goals-container" class="bg-white divide-y divide-gray-200">
    </tbody>
  </table>
</section>
<section id="completed-goals-list" class="bg-white rounded-xl shadow p-4 overflow-x-auto mt-8">
  <h2 class="text-xl font-semibold mb-4">Completed Goals</h2>
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Goal</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Target Amount</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Saved Amount</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Category</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Deadline</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Created At</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Time Left</th>
        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
      </tr>
    </thead>
    <tbody id="completed-goals-container" class="bg-white divide-y divide-gray-200">
      <!-- JS will render completed goals rows here -->
    </tbody>
  </table>
</section>


  </main>

  <script src="script.js"></script>
</body>
</html>
